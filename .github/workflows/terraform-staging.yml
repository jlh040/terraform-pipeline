name: "Terraform Provision Infrastructure"

on:
  push:
    branches: [ "main" ]
    paths: [ "**/*.tf" ]

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_REGION: us-east-1

jobs:
  terraform:
    name: "Terraform Apply"
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v3
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v2
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ env.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ env.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Generate Random Suffix
        id: random_suffix
        run: |
          SUFFIX=$(head /dev/urandom | tr -dc 'a-z0-9' | head -c 8)
          echo "suffix=$SUFFIX" >> $GITHUB_OUTPUT
      - name: Terraform init
        run: terraform init
      - name: Terraform Plan
        run: terraform plan -var="random_suffix=${{ steps.random_suffix.outputs.suffix }}"
      - name: Terraform Apply
        run: terraform apply -auto-approve -var="random_suffix=${{ steps.random_suffix.outputs.suffix }}"